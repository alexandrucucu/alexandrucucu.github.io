<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="ticketBody">
  <div class="ticket">
    <h1 id="tipoFactura">Factura simplificada</h1>
    <h2 id="nombreEmisor">Dakatattoo</h2>

    <!-- BLOQUE DE DATOS (EMISOR Y RECEPTOR) -->
    <div id="bloquePersonas" class="bloque-personas">
      <div class="bloque-datos">
        <span class="tituloBloque">DATOS DEL EMISOR</span>
        <p id="emisorNombre"><strong>Danielka García Guido</strong></p>
        <p id="emisorDni">Y0743218x</p>
        <p id="emisorDireccion">Av. Madrid 33, local izq</p>
        <p id="emisorCiudad">Zaragoza, 50004</p>
        <p id="emisorTelefono">684053376</p>
        <p id="emisorEmail">Dakaguido@gmail.com</p>
      </div>

      <div class="bloque-datos" id="bloqueReceptor" style="display: none;">
        <span class="tituloBloque">DATOS DEL RECEPTOR</span>
        <p id="receptorNombre"><strong>-</strong></p>
        <p id="receptorDni">-</p>
        <p id="receptorDireccion">-</p>
        <p id="receptorCiudad">-</p>
        <p id="receptorTelefono">-</p>
        <p id="receptorEmail">-</p>
      </div>
    </div>

    <div class="datosFactura">
      <p><span class="etiquetaFondo">Número de factura:</span> <strong id="numFactura">-</strong></p>
      <p><span class="etiquetaFondo">Fecha:</span> <strong id="fechaFactura">-</strong></p>
    </div>

    <table>
      <thead>
        <tr>
          <th>Concepto/Descripción</th>
          <th>Cantidad</th>
          <th>Precio</th>
          <th>Importe</th>
        </tr>
      </thead>
      <tbody id="tablaConceptos"></tbody>
    </table>

    <div class="total">
      <div class="totalLineaH2">
        <span>Total factura:</span>
        <h2 id="totalFactura">0€</h2>
      </div>
    </div>

    <div class="acciones">
      <button type="button" class="btnSecundario" id="btnEditar">Modificar</button>
      <button type="button" class="btnSecundario" id="btnNueva">Nueva Factura</button>
      <button type="button" class="btnSecundario btnPrint" onclick="window.print()">Imprimir / PDF</button>
    </div>
  </div>

  <script src="factura.js"></script>
</body>
</html>
