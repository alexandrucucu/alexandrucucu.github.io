<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Factura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="ticketBody">
  <!-- Contenedor dinámico donde se inyectarán una o varias facturas -->
  <main id="contenedorLote"></main>

  <!-- Barra flotante de acciones (se oculta al imprimir) -->
  <nav class="acciones" style="margin: 20px auto; max-width: 550px; text-align: center;">
    <button type="button" class="btnSecundario" id="btnEditar">Modificar</button>
    <button type="button" class="btnSecundario" id="btnNueva">Nueva Factura</button>
    <button type="button" class="btnSecundario btnPrint" onclick="window.print()">Imprimir / PDF</button>
  </nav>

  <script src="factura.js"></script>
</body>
</html>
