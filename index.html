<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generador web de facturas simplificadas y ordinarias adaptado a flujos Excel/CSV">
  <title>Nueva Factura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Encabezado con título dinámico y utilidades -->
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h1 id="tituloNegocio" style="margin: 0;">Nueva Factura</h1>
      <div style="display: flex; gap: 5px;">
        <button type="button" id="btnToggleCsv" class="btnCalcMini" style="background: #27ae60;" title="Importar desde línea o bloque CSV de Excel">📥 Pegar CSV</button>
        <button type="button" id="btnAbrirCalc" class="btnCalcMini" title="Calculadora rápida de IVA">🔍 Calc. IVA</button>
      </div>
    </header>
    
    <!-- Bloque de alertas para validaciones -->
    <div id="mensajeError" class="alerta-error" role="alert" style="display: none;"></div>

    <!-- CAJA DESPLEGABLE PARA IMPORTAR LINEA O BLOQUE CSV -->
    <section id="bloqueCsv" style="display: none; background: #eef9f1; border: 1px solid #27ae60; padding: 10px; border-radius: 6px; margin-bottom: 12px;">
      <label for="inputCsv" style="font-size: 12px; font-weight: bold; color: #27ae60; display: block; margin-bottom: 4px;">
        Pegar CSV de Excel (Nº, Fecha, Concepto, Cantidad, Precio, [IVA%]):
      </label>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <textarea id="inputCsv" rows="3" placeholder="Ejemplo:&#10;158, 16/10/2026, Piercing, 1, 25, 21&#10;158, 16/10/2026, Joyería, 1, 15, 21&#10;159, 17/10/2026, Tatuaje, 1, 80, 21" style="font-size: 12px; width: 100%; font-family: monospace;"></textarea>
        
        <!-- OPCIONES CSV -->
        <div style="display: flex; gap: 6px; justify-content: flex-end;">
          <button type="button" id="btnCargarCsv" style="background: #27ae60; font-size: 13px; padding: 6px 10px;">Rellenar Formulario</button>
          <button type="button" id="btnDirectoCsv" style="background: #2980b9; font-size: 13px; padding: 6px 10px;">Ir Directo a Factura 🚀</button>
        </div>
      </div>
    </section>

    <main class="formulario">
      <!-- Datos básicos de la factura -->
      <label for="numeroFactura">Número factura</label>
      <input type="text" id="numeroFactura" placeholder="Ej: 0001" autocomplete="off">

      <label for="fecha">Fecha</label>
      <input type="date" id="fecha">
      <button type="button" id="fechaHoy">Usar fecha actual</button>

      <hr>

      <!-- Configuración de desglose e impuestos -->
      <div class="bloque-iva">
        <input type="checkbox" id="chkDesglosarIva">
        <label for="chkDesglosarIva">Desglosar IVA:</label>
        <input type="number" id="porcentajeIva" value="21" min="0" max="100" step="1">
        <span>%</span>
      </div>

      <hr>

      <!-- Listado dinámico de conceptos/servicios -->
      <h2>Conceptos</h2>
      <div id="conceptosContainer"></div>
      <button type="button" id="agregarConcepto">+ Añadir concepto</button>

      <hr>

      <!-- Sección condicional para Factura Ordinaria (Receptor / Cliente) -->
      <button type="button" id="btnToggleReceptor" class="btnSecundario">+ Añadir datos cliente (Receptor)</button>
      
      <div id="seccionReceptor" style="display: none; margin-top: 10px;">
        <h3>Datos del Receptor</h3>

        <label for="receptorNombre">Nombre completo *</label>
        <input type="text" id="receptorNombre" placeholder="Ej: Juan Pérez Gómez">

        <label for="receptorDni">NIF / DNI / NIE *</label>
        <input type="text" id="receptorDni" placeholder="Ej: 00000000X">

        <label for="receptorDireccion">Dirección *</label>
        <input type="text" id="receptorDireccion" placeholder="Ej: Calle Ejemplar 123, 1ºA">

        <label for="receptorCiudad">Ciudad y CP *</label>
        <input type="text" id="receptorCiudad" placeholder="Ej: Madrid, 28001">

        <label for="receptorTelefono">Teléfono (opcional)</label>
        <input type="text" id="receptorTelefono" placeholder="Ej: 600000000">

        <label for="receptorEmail">Correo (opcional)</label>
        <input type="text" id="receptorEmail" placeholder="Ej: cliente@ejemplo.com">
      </div>

      <hr>

      <!-- Botones de acción principal -->
      <div style="display: flex; gap: 8px;">
        <button type="button" id="btnLimpiar" class="btnSecundario" style="flex: 1;" title="Vaciar campos del formulario sin borrar datos del emisor">Limpiar</button>
        <button type="button" id="generarFactura" class="btnPrincipal" style="flex: 2; margin-top: 0;">Generar factura</button>
      </div>
    </main>
  </div>

  <!-- Modal Flotante: Calculadora independiente de IVA -->
  <div id="modalCalc" class="modal-calc" aria-hidden="true" style="display: none;">
    <div class="modal-calc-content" role="dialog" aria-labelledby="tituloModal">
      <div class="modal-calc-header">
        <h3 id="tituloModal">Calculadora de IVA rápida</h3>
        <span id="btnCerrarCalc" class="btn-cerrar-modal" role="button" tabindex="0" aria-label="Cerrar modal">&times;</span>
      </div>
      <p style="font-size: 12px; color: #666; margin-top: 0;">Introduce el precio total (IVA incluido) para calcular la base:</p>

      <div style="display: flex; gap: 10px; margin-bottom: 12px;">
        <div style="flex: 2;">
          <label for="calcPrecioTotal" style="font-size: 12px; font-weight: bold;">Precio Total (€)</label>
          <input type="number" id="calcPrecioTotal" placeholder="Ej: 50" min="0" step="0.01">
        </div>
        <div style="flex: 1;">
          <label for="calcPctIva" style="font-size: 12px; font-weight: bold;">% IVA</label>
          <input type="number" id="calcPctIva" value="21" min="0" step="1">
        </div>
      </div>

      <div class="calc-resultados">
        <div class="calc-fila"><span>Base Imponible:</span> <strong id="calcBase">0.00 €</strong></div>
        <div class="calc-fila"><span>Cuota IVA:</span> <strong id="calcCuota">0.00 €</strong></div>
        <div class="calc-fila calc-total"><span>Total final:</span> <strong id="calcTotal">0.00 €</strong></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
