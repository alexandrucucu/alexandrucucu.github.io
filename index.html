<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Factura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 id="tituloNegocio">Nueva Factura</h1>
    
    <div id="mensajeError" class="alerta-error" style="display: none;"></div>

    <div class="formulario">
      <label for="numeroFactura">Número factura</label>
      <input type="text" id="numeroFactura" placeholder="Ej: 1219">

      <label for="fecha">Fecha</label>
      <input type="date" id="fecha">
      <button type="button" id="fechaHoy">Usar fecha actual</button>

      <hr>

      <h2>Conceptos</h2>
      <div id="conceptosContainer"></div>
      <button type="button" id="agregarConcepto">+ Añadir concepto</button>

      <hr>

      <!-- BOTÓN Y SECCIÓN PARA DATOS DEL RECEPTOR -->
      <button type="button" id="btnToggleReceptor" class="btnSecundario">+ Añadir datos cliente (Receptor)</button>
      
      <div id="seccionReceptor" style="display: none; margin-top: 10px;">
        <h3>Datos del Receptor</h3>
        <label for="receptorNombre">Nombre completo</label>
        <input type="text" id="receptorNombre" placeholder="Ej: Laura Romero">

        <label for="receptorDni">NIF / DNI / NIE</label>
        <input type="text" id="receptorDni" placeholder="Ej: 30845417W">

        <label for="receptorDireccion">Dirección</label>
        <input type="text" id="receptorDireccion" placeholder="Ej: C/ Doctor Lozano Monzon #6 1C">

        <label for="receptorCiudad">Ciudad y CP</label>
        <input type="text" id="receptorCiudad" placeholder="Ej: Zaragoza, 50006">

        <label for="receptorTelefono">Teléfono (opcional)</label>
        <input type="text" id="receptorTelefono" placeholder="Ej: 616323224">

        <label for="receptorEmail">Correo (opcional)</label>
        <input type="text" id="receptorEmail" placeholder="Ej: cliente@gmail.com">
      </div>

      <hr>

      <button type="button" id="generarFactura" class="btnPrincipal">Generar factura</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
